<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Disk Usage dashboard — explore disk usage, team and user breakdowns, directory treemaps, history trends, and permission issues from duscan report files."
    />
    <title>Disk Usage</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){try{var t=localStorage.getItem('duscan-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark')}else if(!matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.classList.add('dark')}}catch(e){}})()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
